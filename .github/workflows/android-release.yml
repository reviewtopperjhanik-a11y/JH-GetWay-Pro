name: Android CI & Auto Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Optional semantic version (e.g. 1.0.5). Leave blank to auto-bump.'
        required: false
        default: ''
      version_code:
        description: 'Optional integer versionCode. Leave blank to auto-increment.'
        required: false
        default: ''
      publish_release:
        description: 'Publish GitHub Release (set true to publish)'
        type: boolean
        required: false
        default: false

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  EXPECTED_APPLICATION_ID: com.aistudio.jhgetway.iffndf
  EXPECTED_KEY_ALIAS: upload

jobs:
  test:
    name: Unit & Robolectric Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure debug keystore exists for test builds
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 --decode debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Run release policy script unit tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Run unit tests & debug compile check
        timeout-minutes: 20
        env:
          GITHUB_REPOSITORY: ""
        run: |
          ARGS="-PgithubRepo= -Dorg.gradle.jvmargs=-Xmx2560m --console=plain --no-daemon"
          if [ -x ./gradlew ]; then
            ./gradlew :app:testDebugUnitTest :app:assembleDebug ${ARGS}
          else
            gradle :app:testDebugUnitTest :app:assembleDebug ${ARGS}
          fi

      - name: Upload test failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-failure-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          retention-days: 7

  release:
    name: Build, Sign & Publish Release APK
    needs: test
    if: >-
      github.event_name != 'pull_request' &&
      ((github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')) ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Compute release version & tag
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION_NAME: ${{ github.event.inputs.version_name }}
          INPUT_VERSION_CODE: ${{ github.event.inputs.version_code }}
          INPUT_PUBLISH_RELEASE: ${{ github.event.inputs.publish_release }}
          REPO: ${{ github.repository }}
        run: python3 .github/scripts/release_policy.py

      - name: Configure permanent production keystore (fail closed)
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          EXPECTED_SIGNING_SHA256: ${{ vars.EXPECTED_SIGNING_SHA256 || secrets.EXPECTED_SIGNING_SHA256 }}
        run: |
          MISSING=()
          [ -z "${KEYSTORE_BASE64}" ] && MISSING+=("KEYSTORE_BASE64")
          [ -z "${SECRET_STORE_PASSWORD}" ] && MISSING+=("STORE_PASSWORD")
          [ -z "${SECRET_KEY_PASSWORD}" ] && MISSING+=("KEY_PASSWORD")
          if [ "${#MISSING[@]}" -gt 0 ]; then
            echo "::error::Missing required permanent signing secret(s): ${MISSING[*]}. See docs/GITHUB_RELEASE_AND_SIGNING_GUIDE.md to configure them once."
            exit 1
          fi

          KEYSTORE_FILE="${GITHUB_WORKSPACE}/my-upload-key.jks"
          KEYSTORE_FILE="${KEYSTORE_FILE}" python3 - <<'PY'
          import base64, os, re, sys

          raw = os.environ.get("KEYSTORE_BASE64", "")
          out_path = os.environ["KEYSTORE_FILE"]

          # Remove surrounding quotes and any Data URI prefix (common when copied from web converters)
          cleaned = raw.strip().strip('"').strip("'")
          if cleaned.lower().startswith("data:") and ";base64," in cleaned.lower():
              idx = cleaned.lower().index(";base64,")
              cleaned = cleaned[idx + len(";base64,"):]

          # Strip all ASCII/Unicode whitespace and zero-width characters from mobile copy-paste
          cleaned = re.sub(r"[\s\u00a0\u200b-\u200d\ufeff]+", "", cleaned)

          if not cleaned:
              sys.exit("::error::KEYSTORE_BASE64 is empty after trimming whitespace.")

          if "BEGINCERTIFICATE" in cleaned.upper() or "-----BEGIN" in raw.upper():
              sys.exit("::error::KEYSTORE_BASE64 looks like a PEM text/certificate instead of the Base64-encoded .jks keystore file. Encode my-upload-key.jks itself to Base64.")

          # Convert URL-safe base64 (-, _) to standard base64 (+, /) and fix missing '=' padding
          normalized = cleaned.replace("-", "+").replace("_", "/")
          invalid_chars = sorted(set(re.findall(r"[^A-Za-z0-9+/=]", normalized)))
          if invalid_chars:
              sys.exit(
                  f"::error::KEYSTORE_BASE64 contains {len(invalid_chars)} invalid non-Base64 character type(s) "
                  f"(cleaned length={len(normalized)}). Re-encode my-upload-key.jks using 'base64 -w 0 my-upload-key.jks' and paste the complete output without extra symbols."
              )

          # Strip any stray trailing/internal '=' issues and re-pad cleanly if mod 4 is 2 or 3
          if "=" in normalized.rstrip("="):
              sys.exit(
                  f"::error::KEYSTORE_BASE64 has '=' padding characters in the middle (cleaned length={len(normalized)}). "
                  "This usually means multiple lines or values were concatenated incorrectly. Re-generate and paste a single clean Base64 string."
              )

          normalized_unpadded = normalized.rstrip("=")
          rem = len(normalized_unpadded) % 4
          if rem == 1:
              sys.exit(
                  f"::error::KEYSTORE_BASE64 appears truncated or corrupted (unpadded length={len(normalized_unpadded)}, mod 4 == 1). "
                  "On Android/Termux, copying from terminal screen can cut off characters; save to a .txt file (e.g. 'base64 -w 0 my-upload-key.jks > ks.b64.txt') and copy the entire file."
              )
          if rem in (2, 3):
              normalized = normalized_unpadded + ("=" * (4 - rem))

          try:
              decoded = base64.b64decode(normalized, validate=True)
          except Exception as exc:
              sys.exit(f"::error::KEYSTORE_BASE64 could not be decoded ({type(exc).__name__}, length={len(normalized)}). Re-encode my-upload-key.jks cleanly.")

          if len(decoded) < 100:
              sys.exit(
                  f"::error::Decoded keystore is only {len(decoded)} bytes, which is too small to be a valid .jks file. "
                  "Make sure you encoded the my-upload-key.jks file itself, not the filename or password."
              )

          with open(out_path, "wb") as f:
              f.write(decoded)
          os.chmod(out_path, 0o600)
          print(f"Decoded KEYSTORE_BASE64 cleanly ({len(decoded)} bytes)")
          PY

          KEYTOOL_OUT=$(keytool -list -v \
            -storetype PKCS12 \
            -keystore "${KEYSTORE_FILE}" \
            -storepass "${SECRET_STORE_PASSWORD}" \
            -alias "${EXPECTED_KEY_ALIAS}" 2>&1) || {
            echo "::error::Could not open PKCS12 keystore or find alias '${EXPECTED_KEY_ALIAS}'."
            exit 1
          }

          CERT_SHA256=$(printf '%s\n' "${KEYTOOL_OUT}" | grep -iE 'SHA256:|SHA-256:' | head -n 1 | sed -E 's/.*SHA-?256:[[:space:]]*//I' | tr -d ':' | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')
          if ! printf '%s' "${CERT_SHA256}" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::Could not extract valid SHA-256 fingerprint from keystore alias '${EXPECTED_KEY_ALIAS}'."
            exit 1
          fi

          if [ -n "${EXPECTED_SIGNING_SHA256}" ]; then
            PINNED=$(printf '%s' "${EXPECTED_SIGNING_SHA256}" | tr -d ':' | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')
            if [ "${CERT_SHA256}" != "${PINNED}" ]; then
              echo "::error::Keystore SHA-256 (${CERT_SHA256}) does not match EXPECTED_SIGNING_SHA256 (${PINNED})."
              exit 1
            fi
          fi

          {
            echo "KEYSTORE_PATH=${KEYSTORE_FILE}"
            echo "STORE_PASSWORD=${SECRET_STORE_PASSWORD}"
            echo "KEY_PASSWORD=${SECRET_KEY_PASSWORD}"
          } >> "$GITHUB_ENV"
          echo "keystore_path=${KEYSTORE_FILE}" >> "$GITHUB_OUTPUT"
          echo "cert_sha256=${CERT_SHA256}" >> "$GITHUB_OUTPUT"
          echo "Permanent keystore verified (alias=${EXPECTED_KEY_ALIAS}, sha256=${CERT_SHA256})"

      - name: Build signed Release APK
        timeout-minutes: 15
        env:
          APP_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          APP_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ ! -f "${KEYSTORE_PATH}" ]; then
            echo "::error::Decoded permanent keystore missing at ${KEYSTORE_PATH}."
            exit 1
          fi
          rm -rf app/build/outputs/apk/release
          GRADLE_ARGS="-PciVersionCode=${APP_VERSION_CODE} -PciVersionName=${APP_VERSION_NAME} -PgithubRepo=${GITHUB_REPOSITORY} -PreleaseKeystorePath=${KEYSTORE_PATH} -Dorg.gradle.jvmargs=-Xmx2560m --no-daemon --no-configuration-cache --no-build-cache --console=plain"
          if [ -x ./gradlew ]; then
            ./gradlew :app:assembleRelease ${GRADLE_ARGS}
          else
            gradle :app:assembleRelease ${GRADLE_ARGS}
          fi

      - name: Verify APK signature & package release assets
        id: package
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          EXPECTED_CERT_SHA256: ${{ steps.signing.outputs.cert_sha256 }}
          REPO: ${{ github.repository }}
        run: |
          if find app/build/outputs/apk/release -name "*-unsigned.apk" | grep -q .; then
            echo "::error::Unsigned release APK detected in app/build/outputs/apk/release."
            exit 1
          fi
          RELEASE_APK_SRC="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "${RELEASE_APK_SRC}" ]; then
            RELEASE_APK_SRC=$(find app/build/outputs/apk/release -maxdepth 2 -name "*.apk" | head -n 1)
          fi
          if [ -z "${RELEASE_APK_SRC}" ] || [ ! -f "${RELEASE_APK_SRC}" ]; then
            echo "::error::Signed release APK not found!"
            exit 1
          fi

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          BUILD_TOOLS_DIR=$(find "${SDK_ROOT}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          AAPT2_BIN="${BUILD_TOOLS_DIR}/aapt2"
          APKSIGNER_BIN="${BUILD_TOOLS_DIR}/apksigner"

          BADGING=$("${AAPT2_BIN}" dump badging "${RELEASE_APK_SRC}")
          APK_PKG=$(printf '%s\n' "${BADGING}" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)
          APK_VCODE=$(printf '%s\n' "${BADGING}" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" | head -n 1)
          APK_VNAME=$(printf '%s\n' "${BADGING}" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n 1)

          if [ "${APK_PKG}" != "${EXPECTED_APPLICATION_ID}" ] || [ "${APK_VCODE}" != "${VERSION_CODE}" ] || [ "${APK_VNAME}" != "${VERSION_NAME}" ]; then
            echo "::error::APK metadata mismatch (pkg=${APK_PKG}, code=${APK_VCODE}, name=${APK_VNAME})."
            exit 1
          fi

          if ! SIGNER_OUT=$("${APKSIGNER_BIN}" verify --verbose --print-certs "${RELEASE_APK_SRC}" 2>&1); then
            printf '%s\n' "${SIGNER_OUT}"
            echo "::error::apksigner verification failed for ${RELEASE_APK_SRC}."
            exit 1
          fi
          APK_CERT_SHA256=$(SIGNER_OUT="${SIGNER_OUT}" python3 - <<'PY'
          import os, re
          text = os.environ.get("SIGNER_OUT", "")
          m = re.search(
              r"certificate\s+SHA-256\s+digest:\s*((?:[0-9a-fA-F]{2}:?){32})",
              text,
              re.IGNORECASE,
          )
          if m:
              print(re.sub(r"[^0-9a-fA-F]", "", m.group(1)).lower())
          PY
          )
          if [ -z "${APK_CERT_SHA256}" ] || [ "${APK_CERT_SHA256}" != "${EXPECTED_CERT_SHA256}" ]; then
            printf '%s\n' "${SIGNER_OUT}"
            echo "::error::APK signer SHA-256 (${APK_CERT_SHA256}) does not match expected keystore (${EXPECTED_CERT_SHA256})."
            exit 1
          fi

          mkdir -p release-artifacts
          RELEASE_APK_NAME="JH-GetWay-${RELEASE_TAG}-release.apk"
          cp "${RELEASE_APK_SRC}" "release-artifacts/${RELEASE_APK_NAME}"
          APK_SHA256=$(sha256sum "release-artifacts/${RELEASE_APK_NAME}" | awk '{print $1}')
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          APK_URL="https://github.com/${REPO}/releases/download/${RELEASE_TAG}/${RELEASE_APK_NAME}"

          cat > release-artifacts/update-manifest.json <<EOF
          {
            "tag": "${RELEASE_TAG}",
            "versionName": "${VERSION_NAME}",
            "versionCode": ${VERSION_CODE},
            "packageId": "${EXPECTED_APPLICATION_ID}",
            "apkName": "${RELEASE_APK_NAME}",
            "apkAssetUrl": "${APK_URL}",
            "sha256": "${APK_SHA256}",
            "signingMode": "production",
            "signingCertSha256": "${APK_CERT_SHA256}",
            "releaseDate": "${BUILD_DATE}"
          }
          EOF

          (
            cd release-artifacts
            sha256sum "${RELEASE_APK_NAME}" "update-manifest.json" > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

          echo "release_apk=${RELEASE_APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=${APK_SHA256}" >> "$GITHUB_OUTPUT"
          echo "apk_cert_sha256=${APK_CERT_SHA256}" >> "$GITHUB_OUTPUT"

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JH-GetWay-${{ steps.version.outputs.release_tag }}-release
          path: |
            release-artifacts/*.apk
            release-artifacts/update-manifest.json
            release-artifacts/SHA256SUMS.txt
          retention-days: 30

      - name: Publish GitHub Release
        if: steps.version.outputs.should_publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          name: JH GetWay ${{ steps.version.outputs.release_tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## JH GetWay ${{ steps.version.outputs.release_tag }}

            - **Application ID:** `${{ env.EXPECTED_APPLICATION_ID }}`
            - **Version:** `${{ steps.version.outputs.version_name }}` (Build `${{ steps.version.outputs.version_code }}`)
            - **Release APK:** `${{ steps.package.outputs.release_apk }}`
            - **APK SHA-256:** `${{ steps.package.outputs.apk_sha256 }}`
            - **Signing Cert SHA-256:** `${{ steps.package.outputs.apk_cert_sha256 }}`
          files: |
            release-artifacts/*.apk
            release-artifacts/update-manifest.json
            release-artifacts/SHA256SUMS.txt
